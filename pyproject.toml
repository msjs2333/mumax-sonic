[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mumax-sonic"
version = "0.1.0"
description = "Spatial auditory monitoring prototype for micromagnetic fields"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.26,<3", "psutil>=5.9,<8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mumax-sonic = "mumax_sonic.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
